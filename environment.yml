# One environment for the whole workshop - both days, every notebook.
#
#   conda env create -f environment.yml
#   conda activate scverse-workshop
#   python -m ipykernel install --user --name scverse-workshop
#
# Deliberately unpinned: we want the current scverse stack every time this is
# reused. If a release breaks a notebook, pin that one package here and say why.
name: scverse-workshop

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip
  # scanorama and scrublet both require annoy, which publishes only one wheel on
  # PyPI (cp310, macOS arm64). On Python 3.12 pip therefore compiles it from
  # source, which fails on any machine without a C++ toolchain. Installing the
  # conda-forge build first gives pip a prebuilt annoy it treats as satisfied.
  - python-annoy
  - pip:
      # notebook interface
      - jupyterlab
      - notebook
      - ipykernel

      # core
      - scanpy
      # anndata 0.13.3 removed H5Group from anndata._io.specs.methods, which
      # cellrank 2.3.2 still imports. Unpin once cellrank releases a fix.
      - "anndata<0.13.3"
      - scikit-misc
      - leidenalg
      - igraph
      - seaborn

      # imported directly by notebooks, so pinned here rather than relied on
      # arriving through scanpy / spatialdata
      - numpy
      - pandas
      - matplotlib
      - scipy
      - scikit-learn
      - geopandas
      - shapely

      # day 1
      - scrublet
      - decoupler
      - pydeseq2
      - pybiomart
      - adjustText
      - palantir
      - "cellrank>=2.3"   # 2.0.x is what the solver falls back to, and it is far older
      - scanorama
      # scanpy 1.12.4's harmony_integrate does harmony_out.Z_corr.T, which is only
      # correct for harmonypy 0.0.x. 2.x already returns cells-by-PCs and the
      # transpose makes the shape invalid.
      - "harmonypy==0.0.10"
      - scib-metrics

      # day 2 morning
      - liana
      - pertpy   # only Milo is used here; Sccoda would additionally need pertpy[jax]
      # No R here, so nb2_differential_cellular_abundance.ipynb (rpy2 -> miloR)
      # does not run under this environment; use pixi, or its pertpy variant.
      # miloR has no osx-arm64 conda build at all - see pixi.toml.

      # day 2 afternoon - spatial
      - spatialdata
      - spatialdata-io
      - spatialdata-plot
      - squidpy
      - cellcharter
      - scvi-tools
      - pyproj
